name: Move LeetCode to DSA

on:
  push:
    branches: [ main ]
    paths:
      - '[0-9]*-*' # Only triggers when LeetHub creates folders like 0217-contains-duplicate

jobs:
  move-files:
    if: "!contains(github.event.head_commit.message, 'Auto-move LeetCode')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move LeetCode folders into DSA
        run: |
          mkdir -p DSA
          for dir in [0-9]*-*; do
            if [ -d "$dir" ]; then
              git mv "$dir" DSA/
            fi
          done

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-move LeetCode solutions to DSA" || echo "No changes to commit"
          git push
