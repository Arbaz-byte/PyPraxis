name: Move LeetCode solutions into DSA/weekNN

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: move-leetcode
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    # Prevents triggering itself after moving files
    if: "!contains(github.event.head_commit.message, 'Move LeetCode solutions')"

    steps:
      - name: Wait for LeetHub to finish
        run: sleep 30

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move new problem folders into the current week folder
        shell: bash
        run: |
          set -euo pipefail

          export TZ=Asia/Kolkata

          START=$(date -d "2026-10-01" +%s)
          NOW=$(date +%s)
          WEEK=$(( (NOW - START) / 604800 + 1 ))
          [ "$WEEK" -lt 1 ] && WEEK=1
          DEST="DSA/$(printf 'week%02d' "$WEEK")"
          mkdir -p "$DEST"

          moved=0

          shopt -s nullglob
          for d in [0-9][0-9][0-9][0-9]-*/; do
            [ -d "$d" ] || continue
            d="${d%/}"

            # Avoid mv error if a same-named folder already exists in the destination
            if [ -d "$DEST/$d" ]; then
              echo "Destination already contains $d; removing it."
              rm -rf "$DEST/$d"
            fi

            # Prefer the original LeetHub v2 message for this folder
            ORIG_MSG=$(git log --pretty=%B -- "$d" | grep -E "Time:|Space:|LeetHub|Add " | head -n 1 || true)

            if [ -z "$ORIG_MSG" ]; then
              ORIG_MSG=$(git log -1 --pretty=%B -- "$d" || true)
            fi

            # Clean up and keep only the first meaningful line as the commit subject
            ORIG_MSG=$(printf '%s' "$ORIG_MSG" | tr -d '\r' | sed '/^$/d' | head -n 1)
            [ -z "$ORIG_MSG" ] && ORIG_MSG="Add $d"

            mv "$d" "$DEST/"
            echo "Moved $d -> $DEST/"

            git add -A
            if git diff --cached --quiet; then
              echo "No changes to commit for $d"
              continue
            fi

            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "$ORIG_MSG"

            moved=1
          done
          shopt -u nullglob

          if [ "$moved" -eq 0 ]; then
            echo "Nothing to move."
            exit 0
          fi

          git pull --rebase origin main
          git push origin main
